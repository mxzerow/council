show_exchange: ask
# Gemini route (core.md, Gemini transport). Ordered: primary, then fallbacks.
# agy = Antigravity CLI (Claude Code only); cursor = Cursor CLI or Task.
# api = Gemini Developer API with your own key (needs gemini_api.enabled: true).
gemini_transport: [agy, cursor]

gemini_api:
  enabled: false        # true to allow the api transport
  tier: free            # free | paid; free may use prompts/replies for product improvement
  free_tier_ack: false   # free must be acknowledged; never send PHI/confidential text
  # timeout_sec: 1200   # per call; default 1200 free, 300 paid (30..3600)
  thinking_level: high  # low | medium | high; independent of seat effort
  max_output_review: 32768
  max_output_rewrite: 65536
  max_model_steps: 2    # lower versions of same line after 404/400-model/429/503
  # key_file: set in config.local.yaml; default ~/.council/gemini.key

# runs_dir: where run folders (and later resolver state) live. Resolution order:
# config.local.yaml (gitignored) > this file > default ~/.council/runs (outside the skill folder, so syncing or
# copying the skill never uploads past council text). Omit to use the default.
# runs_dir: ~/.council/runs
max_reviewers: 7
cli_timeout_sec: 600
run_retention_count: 10
run_retention_days: 14
stall_checkin_sec: 60
# Roster: one list for both harnesses (core.md § Roster). A seat names a model, not a transport:
# family + line (+ effort); the version is resolved to the newest of that line, never another
# line. Optional keys: role (reviewer | breadth-auditor | rewriter), label, pin (exact slug).
# Unknown role values are a config error. A family with no transport in the current harness is
# skipped (Claude Code skips `claude` seats: same family as the orchestrator).
# Lineup: Opus drafts (seat 0) -> reviewers report gaps only -> Opus integrates (a stage, not a seat)
# -> the rewriter polishes for readability. The previous 7-seat Claude Code and 4-seat Cursor
# rosters are in git history (commit 5ccf6c1, config.yaml).
seats:
  - family: gemini
    line: argon
    effort: medium
    role: breadth-auditor
    label: Gemini Argon (breadth)
  - family: gpt
    line: sol
    effort: medium
    label: GPT Sol
  # Rewriters are an ORDERED FALLBACK CHAIN: the first one that resolves and works does the whole
  # rewrite (core.md, Stages step 4). Rewriting is mechanical, so effort is low (fewer thinking tokens).
  - family: gemini
    line: flash
    effort: low
    role: rewriter
    label: Gemini Flash (rewrite, 1st)
  - family: claude
    line: sonnet
    effort: medium
    role: rewriter
    label: Claude Sonnet (rewrite, 2nd)
