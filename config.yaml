show_exchange: ask
# runs_dir: where run folders (and later resolver state) live. Resolution order:
# config.local.yaml (gitignored) > this file > default <skill-root>/runs. Omit to use the default.
# runs_dir: D:\Documents\.council-runs
max_reviewers: 7
cli_timeout_sec: 600
run_retention_count: 10
run_retention_days: 14
stall_checkin_sec: 60
# Roster: one list for both harnesses (core.md § Roster). A seat names a model, not a transport:
# family + line (+ effort); the version is resolved to the newest of that line, never another
# line. Optional keys: role (reviewer | breadth-auditor | rewriter), label, pin (exact slug).
# Unknown role values are a config error. A family with no transport in the current harness is
# skipped (Claude Code skips `claude` seats: same family as the orchestrator).
# The previous 7-seat Claude Code roster and 4-seat Cursor roster are in git history
# (commit 5ccf6c1, config.yaml).
seats:
  - family: gemini
    line: argon
    effort: medium
    role: breadth-auditor
    label: Gemini Argon (breadth)
  - family: claude
    line: opus
    effort: medium
    label: Claude Opus
  - family: gpt
    line: sol
    effort: medium
    label: GPT Sol
  - family: gemini
    line: argon
    effort: medium
    label: Gemini Argon (final pass)
