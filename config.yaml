# Shipped defaults. Do not edit this file: put every change in config.local.yaml
# (gitignored, never overwritten by an update). README "Configure"; core.md, Routing.
config_version: 2
show_exchange: ask

# Ordered transports per family, by run origin. cursor = the orchestrator is the Cursor
# IDE agent; default = any other orchestrator. api = Gemini Developer API (own key),
# agy = Antigravity CLI, codex = Codex CLI, cursor_cli = Cursor CLI (Grok only),
# task = Cursor Task, agent = Claude Code subagent. Gemini never goes through Cursor.
routes:
  default:
    gemini: [api, agy]
    gpt: [codex]
    grok: [cursor_cli]
    claude: [agent]
    composer: []
  cursor:
    gemini: [api, agy]
    gpt: [task]
    grok: [cursor_cli]
    claude: [task]
    composer: [task]

gemini_api:
  enabled: false        # true (in config.local.yaml) to allow the api transport
  tier: free            # free | paid; free may use prompts/replies for product improvement
  free_tier_ack: false  # free must be acknowledged; never send PHI/confidential text
  # timeout_sec: 1200   # per call; default 1200 free, 300 paid (30..3600)
  thinking_level: high  # low | medium | high; independent of seat effort
  max_output_review: 32768
  max_output_rewrite: 65536
  max_model_steps: 2    # lower versions of the same line after 404/400-model/429/503
  unavailable_retry_wait_sec: 20  # 503: wait (+0..2 s jitter), then retry the same model
  unavailable_retries: 1
  # key_file: set in config.local.yaml; default ~/.council/gemini.key

# runs_dir: config.local.yaml > this file > default ~/.council/runs
max_reviewers: 7
cli_timeout_sec: 600
run_retention_count: 10
run_retention_days: 14
stall_checkin_sec: 60
# Seats: family + line (+ effort); optional role, label, pin, transports (replaces the
# route list for this seat), fallback_for (runs only if the named seat, listed just
# before it, yields no parsed review on any of its transports).
seats:
  - family: gemini
    line: argon
    effort: medium
    role: breadth-auditor
    label: Gemini Argon (breadth)
    transports: [api, agy]
  - family: gemini
    line: flash
    effort: medium
    label: Gemini Flash (breadth fallback)
    fallback_for: Gemini Argon (breadth)
    transports: [api, agy]
  - family: gpt
    line: sol
    effort: medium
    label: GPT Sol
  - family: gemini
    line: flash
    effort: low
    role: rewriter
    label: Gemini Flash (rewrite, 1st)
  - family: claude
    line: sonnet
    effort: medium
    role: rewriter
    label: Claude Sonnet (rewrite, 2nd)
